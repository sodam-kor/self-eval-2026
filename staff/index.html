<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2026 청학중 교육공동체 만족도 조사 · 교직원</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root {
    --navy: #1e3a6e; --self: #2563eb; --self-soft: #eaf1ff; --self-line: #b5cbf5;
    --grow: #047857; --grow-soft: #e3f6ee; --grow-line: #a9dcc5;
    --star: #b91c1c; --star-soft: #fde8e8; --warn: #b45309; --warn-soft: #fff4e0;
    --ac: #1f4db3; --ac-soft: #ebf0fb; --ac-line: #c3d2f2;
    --ink: #191f28; --sub: #6b7684; --faint: #8b95a1; --bd: #e5e8eb;
    --bg: #f7f8fa; --card: #ffffff; --fs: 1;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); word-break: keep-all; -webkit-font-smoothing: antialiased;
    font-family: "Pretendard", -apple-system, "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; font-size: 16px; line-height: 1.6; letter-spacing: -0.01em; }
  button { font-family: inherit; }

  /* ===== 검토용 탭 (배포 때 제거) ===== */
  .viewtabs { background: #111827; position: sticky; top: 0; z-index: 30; }
  .viewtabs .in { max-width: 1040px; margin: 0 auto; padding: 3px 16px; display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
  .viewtabs .ttl { font-size: 11px; font-weight: 700; color: #9ca3af; margin-right: 2px; }
  .viewtabs button { font-size: 12px; font-weight: 600; border: 0; background: transparent; color: #d1d5db; border-radius: 999px; padding: 2px 10px; cursor: pointer; }
  .viewtabs button.on { background: #fff; color: #111827; }
  .viewtabs select { font: inherit; font-size: 12px; border: 0; border-radius: 999px; padding: 2px 8px; margin-left: auto; background: #374151; color: #fff; }
  .view { display: none; } .view.on { display: block; }

  /* ===== 응답자 화면 ===== */
  #v-form { min-height: 100vh; padding-bottom: 110px; }
  #v-form.ac-indigo { --ac: #3b5bdb; --ac-soft: #eef2ff; --ac-line: #c7d2fe; }
  #v-form.ac-violet { --ac: #7048e8; --ac-soft: #f3f0ff; --ac-line: #d0bfff; }
  #v-form.ac-emerald { --ac: #0ca678; --ac-soft: #e6fcf5; --ac-line: #96f2d7; }
  #v-form.ac-coral { --ac: #f04452; --ac-soft: #fff0f1; --ac-line: #ffc9ce; }
  #v-form.ac-black { --ac: #191f28; --ac-soft: #f2f4f6; --ac-line: #d1d6db; }
  .fwrap { max-width: 680px; margin: 0 auto; padding: 0 18px; }

  /* 고정 머리 */
  .hdr { position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,.96); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--bd); box-shadow: 0 6px 16px rgba(17,24,39,.05); display: none; }
  .hdr .in { max-width: 680px; margin: 0 auto; padding: 8px 18px 7px; }
  .hdr .top { display: flex; align-items: center; gap: 10px; }
  .hdr .no { flex: 0 0 auto; width: 26px; height: 26px; border-radius: 8px; background: var(--ac); color: #fff; font-size: 13px; font-weight: 800;
    display: flex; align-items: center; justify-content: center; }
  .hdr .tt { flex: 1; min-width: 0; line-height: 1.25; }
  .hdr .t1 { font-size: calc(15px * var(--fs)); font-weight: 800; }
  .hdr .t2 { font-size: calc(12px * var(--fs)); color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hdr .cnt { font-size: 12.5px; font-weight: 700; color: var(--sub); white-space: nowrap; }
  .hdr .cnt b { color: var(--ac); }
  .segs { display: flex; gap: 4px; margin-top: 7px; }
  .segs span { flex: 1; height: 4px; border-radius: 999px; background: #edf0f3; overflow: hidden; }
  .segs span i { display: block; height: 100%; width: 0; background: var(--ac); border-radius: 999px; transition: width .25s; }

  /* 시작 화면 (표지) */
  .intro { margin-top: 12px; background: var(--card); border-radius: 24px; position: relative; overflow: hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,.03), 0 10px 30px rgba(17,24,39,.05); }
  .cover { position: relative; padding: 16px 22px 14px; color: #fff; overflow: hidden;
    background: linear-gradient(135deg, var(--ac) 0%, color-mix(in srgb, var(--ac) 70%, #0b1533) 100%); }
  .cover::before { content: ""; position: absolute; right: -70px; top: -80px; width: 240px; height: 240px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.22), rgba(255,255,255,0) 70%); }
  .cover::after { content: ""; position: absolute; left: -40px; bottom: -90px; width: 200px; height: 200px; border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.12), rgba(255,255,255,0) 70%); }
  .brand { display: flex; align-items: center; gap: 10px; position: relative; }
  .brand img { width: 34px; height: 34px; border-radius: 50%; background: #fff; padding: 2px; object-fit: contain; }
  .brand .s1 { font-size: 15px; font-weight: 800; line-height: 1.2; }
  .brand .s2 { font-size: 11.5px; opacity: .8; }
  .cover h1 { font-size: calc(22px * var(--fs)); line-height: 1.3; margin: 10px 0 3px; font-weight: 800; letter-spacing: -0.02em; position: relative; }
  .cover p { margin: 0; font-size: calc(13.5px * var(--fs)); opacity: .88; position: relative; }
  .ibody { padding: 12px 22px 14px; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .pills .due { background: var(--ac-soft); color: var(--ac); font-weight: 800; }
  .pills .due.late { background: #fff4e0; color: #b45309; }
  .pills span { background: var(--bg); border-radius: 999px; padding: 3px 11px; font-size: 12.5px; font-weight: 600; color: #4e5968; }
  .road { margin-top: 2px; position: relative; display: grid; grid-template-columns: repeat(5, 1fr); }
  .road::before { content: ""; position: absolute; top: 16px; left: 10%; right: 10%; border-top: 2px dashed var(--ac-line); }
  .road div { text-align: center; position: relative; }
  .road .i { width: 32px; height: 32px; margin: 0 auto 2px; border-radius: 10px; background: var(--ac-soft); font-size: 16px;
    display: flex; align-items: center; justify-content: center; }
  .road .n { font-size: 11.5px; font-weight: 700; color: #4e5968; line-height: 1.3; }
  .road .c { font-size: 10.5px; color: var(--faint); }
  .field { margin-top: 12px; }
  .field label { display: block; font-size: 13px; font-weight: 700; color: var(--sub); margin-bottom: 6px; }
  .field input { width: 100%; font: inherit; font-size: calc(16px * var(--fs)); padding: 11px 14px; border: 0; border-radius: 12px; background: var(--bg);
    outline: 2px solid transparent; transition: outline-color .15s; }
  .field input:focus { outline-color: var(--ac); background: #fff; }
  .lock { margin-top: 8px; font-size: 12.5px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fsbox { position: absolute; top: 12px; right: 14px; text-align: center; z-index: 2; }
  .fsbox .lb { font-size: 10.5px; font-weight: 700; color: rgba(255,255,255,.8); margin-bottom: 3px; }
  .fsctl { display: inline-flex; background: rgba(255,255,255,.18); border-radius: 8px; padding: 2px; }
  .fsctl button { border: 0; background: transparent; cursor: pointer; padding: 0 8px; line-height: 24px; color: #fff; font-weight: 800; border-radius: 6px; }
  .fsctl .s { font-size: 11px; } .fsctl .m { font-size: 13px; } .fsctl .l { font-size: 15px; }
  .fsctl button.on { background: #fff; color: var(--ac); }
  .review { margin-top: 8px; font-size: 12px; color: var(--faint); display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .resume { display: none; margin-top: 16px; background: var(--ac-soft); border-radius: 14px; padding: 12px 14px; font-size: 14px; }
  .resume b { color: var(--ac); }
  .resume button { border: 0; border-radius: 10px; padding: 7px 12px; font-weight: 700; font-size: 13px; cursor: pointer; margin: 8px 6px 0 0; }
  .resume .go { background: var(--ac); color: #fff; } .resume .new { background: #fff; color: #4e5968; }

  /* 시작 화면 재배치 */
  .chiprow { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; position: relative; }
  .due { display: inline-block; position: relative; background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.28);
    border-radius: 999px; padding: 3px 12px; font-size: 12.5px; }
  .due b { margin-left: 4px; }
  .due.late { background: #fff4e0; color: #b45309; border-color: #fff4e0; }
  .rl { font-size: 13px; font-weight: 700; color: var(--sub); margin-bottom: 6px; }
  .role { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .role button { border: 2px solid var(--bd); background: #fff; border-radius: 14px; padding: 9px 12px; cursor: pointer; text-align: left;
    display: flex; flex-direction: column; gap: 1px; transition: border-color .15s, background .15s; }
  .role button span { font-size: 15px; font-weight: 800; color: var(--ink); }
  .role button small { font-size: 12px; color: var(--sub); }
  .role button.on { border-color: var(--ac); background: var(--ac-soft); }
  .kbdhint { margin-top: 4px; font-size: 12px; color: var(--faint); }

  /* 용어 도움말 */
  .term { border-bottom: 1.5px dotted var(--ac); cursor: help; }
  .term sup { font-size: .65em; color: var(--ac); margin-left: 1px; font-weight: 800; }
  .tip { position: fixed; z-index: 50; background: #191f28; color: #fff; font-size: 13px; line-height: 1.5; padding: 10px 12px; border-radius: 10px;
    box-shadow: 0 10px 24px rgba(0,0,0,.18); opacity: 0; pointer-events: none; transition: opacity .15s; }
  .tip.show { opacity: 1; pointer-events: auto; }
  .tip b { display: block; font-size: 13.5px; margin-bottom: 2px; color: #a5c4ff; }

  /* 제출 전 확인 */
  .rv { background: var(--card); border-radius: 16px; padding: 10px 12px; margin: 10px 0; }
  .rvh { font-weight: 800; font-size: 14px; padding: 2px 4px 6px; }
  .rvi { display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: transparent; padding: 7px 6px; border-radius: 10px; cursor: pointer; text-align: left; }
  .rvi:hover { background: var(--bg); }
  .rvn { color: var(--ac); font-weight: 800; flex: 0 0 auto; }
  .rvt { flex: 1; min-width: 0; font-size: 13.5px; color: #4e5968; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rvv { flex: 0 0 auto; font-size: 12.5px; font-weight: 800; color: var(--ac); background: var(--ac-soft); border-radius: 999px; padding: 2px 10px; max-width: 45%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rvv.m { font-weight: 600; } .rvv.no { color: #b45309; background: #fff4e0; }
  .q.flash { outline-color: var(--ac); }
  .q.kbd { outline: 2px dashed var(--ac-line); }

  /* 단계 제목 */
  .stage-title { margin: 26px 2px 10px; display: flex; gap: 12px; align-items: center; }
  .stage-title .ic { flex: 0 0 auto; width: 46px; height: 46px; border-radius: 14px; background: var(--card); font-size: 24px;
    display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 2px rgba(0,0,0,.04), 0 6px 14px rgba(17,24,39,.05); }
  .stage-title .k { font-size: 12.5px; font-weight: 800; color: var(--ac); letter-spacing: .02em; }
  .stage-title h2 { margin: 2px 0 0; font-size: calc(21px * var(--fs)); font-weight: 800; letter-spacing: -0.02em; }
  .stage-title p { margin: 2px 0 0; font-size: calc(13.5px * var(--fs)); color: var(--sub); }
  .sub-ind { display: none; font-size: 12px; font-weight: 700; color: var(--faint); margin: 16px 4px 6px; }
  .show-ind .sub-ind { display: block; }

  /* 문항 카드 */
  .q { background: var(--card); border-radius: 18px; padding: 16px 18px 14px; margin: 10px 0; position: relative;
    box-shadow: 0 1px 2px rgba(0,0,0,.03); outline: 2px solid transparent; transition: outline-color .15s; }
  .q.missing { outline-color: #ff8a8a; }
  .q .qh { display: flex; gap: 8px; align-items: baseline; padding-right: 22px; }
  .q .qn { flex: 0 0 auto; font-size: calc(16px * var(--fs)); font-weight: 800; color: var(--ac); }
  .q .qx { flex: 1; min-width: 0; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; }
  .q .qx.wrapok { white-space: normal; }
  .q .ck { position: absolute; top: 14px; right: 14px; width: 20px; height: 20px; border-radius: 50%; background: var(--ac); color: #fff;
    font-size: 12px; font-weight: 800; display: none; align-items: center; justify-content: center; }
  .q.answered .ck { display: flex; animation: pop .25s ease-out; }
  .code { display: none; font-size: 11px; font-weight: 700; color: var(--faint); background: var(--bg); border-radius: 4px; padding: 0 5px; margin-left: 4px; }
  .show-ind .code { display: inline-block; }
  .hint { font-size: .8em; color: var(--faint); font-weight: 600; }

  .scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 11px; }
  .scale button { border: 0; background: var(--bg); border-radius: 10px; padding: 7px 2px; cursor: pointer;
    font-size: calc(12.5px * var(--fs)); line-height: 1.2; color: #4e5968; white-space: nowrap; transition: background .12s, color .12s; }
  .scale button b { color: var(--ink); margin-right: 3px; font-weight: 800; }
  .scale button:hover { background: var(--ac-soft); }
  .scale button.on { background: var(--ac); color: #fff; } .scale button.on b { color: #fff; }
  .scale button:focus-visible, .opt:focus-visible, .cta button:focus-visible { outline: 2px solid var(--ac); outline-offset: 2px; }

  .opts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .opt { border: 0; background: var(--bg); border-radius: 999px; padding: 6px 13px; cursor: pointer; font-size: calc(14px * var(--fs)); color: #4e5968; }
  .opt.on { background: var(--ac); color: #fff; }
  .q textarea { width: 100%; font: inherit; font-size: calc(15px * var(--fs)); padding: 12px; border: 0; border-radius: 12px; background: var(--bg); min-height: 90px; margin-top: 10px; resize: vertical; }
  .q textarea:focus { outline: 2px solid var(--ac); background: #fff; }

  .cta { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: linear-gradient(to top, var(--bg) 72%, rgba(247,248,250,0));
    padding: 14px 0 calc(10px + env(safe-area-inset-bottom)); }
  .cta .in { max-width: 680px; margin: 0 auto; padding: 0 18px; display: flex; gap: 8px; align-items: center; position: relative; }
  .cta button { border: 0; border-radius: 14px; font-size: 16px; font-weight: 700; padding: 14px 18px; cursor: pointer; }
  .cta .prev { background: #e8ebef; color: #4e5968; }
  .cta .next { flex: 1; background: var(--ac); color: #fff; box-shadow: 0 6px 16px color-mix(in srgb, var(--ac) 30%, transparent); }
  .cta .msg { position: absolute; left: 50%; transform: translateX(-50%); bottom: 62px; background: #191f28; color: #fff; font-size: 13px; font-weight: 600;
    padding: 8px 14px; border-radius: 999px; white-space: nowrap; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .cta .msg.show { opacity: 1; }
  .saved { font-size: 11px; color: var(--faint); text-align: center; margin-top: 4px; height: 14px; }

  .done { margin-top: 60px; text-align: center; }
  .done .c { width: 76px; height: 76px; border-radius: 50%; background: var(--ac); color: #fff; font-size: 38px; font-weight: 800;
    display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; animation: pop .4s ease-out; }
  @keyframes pop { 0% { transform: scale(.4); opacity: 0; } 70% { transform: scale(1.08); } 100% { transform: scale(1); opacity: 1; } }
  .done h2 { margin: 0 0 6px; font-size: 22px; } .done p { margin: 0; color: var(--sub); }
  .memo { background: #fffbea; border: 1px solid #f5e3a3; border-radius: 14px; padding: 12px 14px; font-size: 13.5px; margin: 24px 0 0; color: #5c4a12; }

  /* ===== 보고서·대시보드 공통 ===== */
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px 80px; }
  h2.sec { font-size: 19px; font-weight: 800; margin: 28px 0 6px; }
  .sec-desc { color: var(--sub); margin: 0 0 12px; font-size: 15px; }
  .chips { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .chip { border-radius: 16px; padding: 14px 16px; border: 1.5px solid; }
  .chip.grow { background: var(--grow-soft); border-color: var(--grow-line); } .chip.self { background: var(--self-soft); border-color: var(--self-line); }
  .chip .n { font-size: 30px; font-weight: 800; line-height: 1.1; } .chip .l { font-weight: 800; } .chip .s { font-size: 13px; color: var(--sub); }
  table.rep { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; font-size: 14px; }
  table.rep th, table.rep td { border-bottom: 1px solid var(--bd); padding: 8px; vertical-align: top; }
  table.rep th { background: #f8fafc; font-size: 12px; color: var(--sub); text-align: center; white-space: nowrap; }
  table.rep td.c { text-align: center; white-space: nowrap; }
  table.rep td.num { text-align: center; font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }
  table.rep tr.grp td { background: #f2f4f8; font-weight: 800; color: var(--navy); }
  table.rep tr.added td { background: #f7faff; }
  .bdg { display: inline-block; font-size: 11px; font-weight: 800; padding: 1px 7px; border-radius: 6px; white-space: nowrap; }
  .bdg.grow { background: var(--grow); color: #fff; } .bdg.self { background: var(--self); color: #fff; } .bdg.star { background: var(--star-soft); color: var(--star); }
  .ok { color: var(--grow); font-weight: 800; } .ok2 { color: var(--self); font-weight: 800; } .no { color: #c0c7d2; }
  .rmemo { background: #fffbea; border: 1px solid #f5e3a3; border-radius: 12px; padding: 12px 14px; font-size: 14px; margin: 14px 0; }

  .flow { display: flex; height: 34px; border-radius: 10px; overflow: hidden; margin: 6px 0 10px; }
  .flow span { display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 13px; }
  .k-same { background: var(--star); } .k-repl { background: var(--grow); } .k-keep { background: var(--self); } .k-opin { background: #64748b; } .k-drop { background: #9ca3af; } .k-part { background: var(--warn); }
  .klegend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13.5px; }
  .klegend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .cmp { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; text-align: center; }
  .cmp .b { background: #fff; border: 1px solid var(--bd); border-radius: 14px; padding: 12px; }
  .cmp .b.hl { background: var(--navy); color: #fff; border-color: var(--navy); }
  .cmp .num { font-size: 28px; font-weight: 800; line-height: 1.15; } .cmp .lb { font-size: 13px; font-weight: 700; } .cmp .sb { font-size: 12px; opacity: .75; }
  .chg { display: grid; grid-template-columns: 1.1fr 30px 1fr; gap: 8px; align-items: center; background: #fff; border: 1px solid var(--bd);
    border-left: 5px solid; border-radius: 12px; padding: 10px 12px; margin: 7px 0; }
  .chg .no2 { font-size: 12px; font-weight: 800; color: var(--sub); } .chg .tx { font-size: 14px; } .chg .sc { font-size: 12px; color: var(--sub); }
  .chg .arr { text-align: center; color: #9aa6b8; font-size: 18px; font-weight: 800; }
  .chg .to { font-size: 14px; } .chg .why { font-size: 12px; color: var(--sub); }
  .tagk { display: inline-block; color: #fff; font-size: 11px; font-weight: 800; padding: 1px 8px; border-radius: 6px; margin-bottom: 2px; }

  /* ===== ④ 결과 대시보드 ===== */
  .demo { background: #111827; color: #fff; border-radius: 12px; padding: 10px 14px; font-size: 13.5px; margin-top: 18px; }
  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 14px; }
  .kpi { background: #fff; border: 1px solid var(--bd); border-radius: 16px; padding: 14px 16px; }
  .kpi .l { font-size: 12.5px; color: var(--sub); font-weight: 700; }
  .kpi .v { font-size: 28px; font-weight: 800; line-height: 1.2; font-variant-numeric: tabular-nums; }
  .kpi .v small { font-size: 14px; color: var(--sub); font-weight: 700; }
  .rtabs { display: flex; gap: 8px; margin: 22px 0 6px; }
  .rtabs button { flex: 1; border: 2px solid var(--bd); background: #fff; border-radius: 14px; padding: 12px; cursor: pointer; text-align: left; }
  .rtabs button b { display: block; font-size: 16px; }
  .rtabs button span { font-size: 12.5px; color: var(--sub); }
  .rtabs button.grow.on { border-color: var(--grow); background: var(--grow-soft); }
  .rtabs button.self.on { border-color: var(--self); background: var(--self-soft); }
  .rpanel { display: none; } .rpanel.on { display: block; }
  .tools { display: flex; gap: 8px; align-items: center; margin: 14px 0 8px; flex-wrap: wrap; }
  .tools h3 { margin: 0; font-size: 16px; margin-right: auto; }

  /* ===== ③ 보고 문서 스타일 ===== */

  .sh { display: flex; gap: 10px; align-items: center; font-size: 17px; font-weight: 800; margin: 28px 0 12px; }
  .sh span { font-size: 12px; color: #fff; background: #111827; border-radius: 6px; padding: 2px 8px; letter-spacing: .04em; }
  .takes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .take { border: 1px solid var(--bd); border-top: 4px solid; border-radius: 14px; padding: 14px 16px; }
  .take.t1 { border-top-color: #111827; } .take.t2 { border-top-color: var(--grow); } .take.t3 { border-top-color: var(--self); }
  .take .big { font-size: 28px; font-weight: 800; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
  .take .tl { font-weight: 800; font-size: 15px; margin-top: 2px; }

  .princ { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .princ > div { display: flex; gap: 10px; background: #f8fafc; border-radius: 14px; padding: 14px; }
  .princ b { flex: 0 0 auto; width: 26px; height: 26px; border-radius: 50%; background: #111827; color: #fff; font-size: 13px;
    display: flex; align-items: center; justify-content: center; }
  .princ .pt { font-weight: 800; font-size: 14.5px; } .princ .pd { font-size: 13px; color: var(--sub); }
  .ba { display: grid; grid-template-columns: 1fr 40px 1fr; gap: 10px; align-items: center; }
  .bx { border: 1px solid var(--bd); border-radius: 14px; padding: 14px 16px; }
  .bx.hl { border-color: #111827; }
  .bx .bt { font-size: 13px; font-weight: 800; color: var(--sub); }
  .bx .bn { font-size: 30px; font-weight: 800; } .bx .bn small { font-size: 14px; color: var(--sub); margin-left: 2px; }
  .stack { display: flex; height: 26px; border-radius: 8px; overflow: hidden; margin: 6px 0 8px; }
  .stack span { display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 800; font-size: 12px; white-space: nowrap; overflow: hidden; }
  .barrow { text-align: center; font-size: 22px; font-weight: 800; color: #9aa6b8; }
  table.doc-t { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  table.doc-t th { background: #111827; color: #fff; font-size: 12px; padding: 8px; text-align: center; }
  table.doc-t td { border-bottom: 1px solid var(--bd); padding: 9px 8px; vertical-align: top; }
  table.doc-t td.c { text-align: center; } table.doc-t td.num { text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
  table.doc-t tr:nth-child(even) td { background: #fafbfc; }
  .effects { display: grid; gap: 8px; }

  .effects span { color: var(--sub); }

  /* ===== ④ 참여 현황 ===== */
  .pboard { background: #fff; border: 1px solid var(--bd); border-radius: 18px; padding: 16px 18px; margin-top: 12px; }
  .ptop { display: flex; gap: 18px; align-items: center; }

  .pinfo .pn b { color: var(--ink); }
  .pbtns { display: flex; gap: 6px; flex-wrap: wrap; }
  .copybtn.light { background: #eef1f5; color: var(--ink); }
  .pmiss { margin-top: 12px; border-top: 1px dashed var(--bd); padding-top: 10px; }
  .pl { font-size: 12.5px; font-weight: 800; color: var(--sub); margin-bottom: 6px; }
  .chips2 { display: flex; flex-wrap: wrap; gap: 5px; }
  .chips2 span { background: #fff4e0; color: #92400e; border-radius: 999px; padding: 2px 10px; font-size: 13px; font-weight: 600; }
  .roster { margin-top: 12px; }
  .roster textarea { width: 100%; min-height: 120px; font: inherit; font-size: 14px; border: 1px solid var(--bd); border-radius: 10px; padding: 10px; margin-bottom: 6px; }

  /* ===== ④ 응답 분포 ===== */
  .dlegend { font-size: 12.5px; color: var(--sub); margin: 0 0 8px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
  .dlegend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: -6px; vertical-align: -1px; }
  .d5 { --dc: #1e3a8a; } .d4 { --dc: #3b82f6; } .d3 { --dc: #93c5fd; } .d2 { --dc: #fbbf24; } .d1 { --dc: #f87171; }
  .dlegend i, .mbar i { background: var(--dc); }

  table.dist td.z { color: #c8ced6 !important; }

  .indcards { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .icard { background: #fff; border: 1px solid var(--bd); border-radius: 14px; padding: 12px; }

  .icard .iv { font-size: 22px; font-weight: 800; color: var(--self); font-variant-numeric: tabular-nums; }

  @media print {

  }

  /* ===== 휴대폰 최적화 ===== */
  @media (max-width: 560px) {

  .rolebar { max-width: 760px; margin: 10px auto 0; padding: 0 16px; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--sub); flex-wrap: wrap; }

  .pend b { display: block; font-size: 18px; color: var(--ink); margin-bottom: 4px; }

  @media (min-width: 561px) { html[lang="ru"] .scale button { font-size: 11px; line-height: 1.25; word-break: break-word; } }

function gloss(text) {
  var h = esc(text);
  GLOSS.forEach(function (g, i) {
    var k = esc(g[0]), pos = h.indexOf(k);
    if (pos >= 0) h = h.slice(0, pos) + '<span class="term" data-g="' + i + '">' + k + '<sup>ⓘ</sup></span>' + h.slice(pos + k.length);
  });
  return h;
}

  if (page === REVIEW()) { submit(); return; }
  var miss = rIn(RAREAS[page]).filter(function (q) { return q[6] === 'L' && !answers[q.ridx]; });
  if (miss.length) {
    miss.forEach(function (q) { document.getElementById('card-' + q.ridx).classList.add('missing'); });
    toast(miss.map(function (q) { return q.rno; }).join(' ') + L(' 문항이 비어 있어요'));
    document.getElementById('card-' + miss[0].ridx).scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }
  go(page + 1);
});
document.getElementById('btnPrev').addEventListener('click', function () { go(page - 1); });

/* PC 숫자키 1~5: 지금 단계에서 아직 답하지 않은 첫 문항에 입력 */
document.addEventListener('keydown', function (e) {
  if (page < 0 || page >= RAREAS.length || e.ctrlKey || e.altKey || e.metaKey) return;
  var tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
  if (!/^[1-5]$/.test(e.key)) return;
  var qs = rIn(RAREAS[page]).filter(function (q) { return q[6] === 'L' && !answers[q.ridx]; });
  if (!qs.length) return;
  e.preventDefault();
  document.querySelector('.scale button[data-q="' + qs[0].ridx + '"][data-v="' + e.key + '"]').click();
  if (qs[1]) { var nx = document.getElementById('card-' + qs[1].ridx); nx.classList.add('kbd'); nx.scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
});

/* 문항 한 줄 맞추기 (휴대폰처럼 좁으면 두 줄 허용) */
function fitAll() {
  var fs = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--fs')) || 1;
  var narrow = window.innerWidth <= 560;
  var max = 16 * fs, min = 12.5;
  document.querySelectorAll('.page').forEach(function (pg) {
    if (pg.style.display === 'none') return;
    pg.querySelectorAll('.qx').forEach(function (el) {
      el.classList.remove('wrapok');
      if (narrow) { el.classList.add('wrapok'); el.style.fontSize = (15 * fs) + 'px'; return; }
      var s = max; el.style.fontSize = s + 'px';
      while (el.scrollWidth > el.clientWidth + 1 && s > min) { s -= 0.5; el.style.fontSize = s + 'px'; }
      if (el.scrollWidth > el.clientWidth + 1) { el.classList.add('wrapok'); el.style.fontSize = Math.max(min, 14.5 * fs) + 'px'; }
    });
  });
}
window.addEventListener('resize', function () { fitAll(); placeSticky(); });

document.querySelectorAll('.fsctl button').forEach(function (b) {
  b.addEventListener('click', function () {
    document.documentElement.style.setProperty('--fs', b.getAttribute('data-fs'));
    document.querySelectorAll('.fsctl button').forEach(function (x) { x.classList.toggle('on', x === b); });
    try { localStorage.setItem('survey-fs', b.getAttribute('data-fs')); } catch (e) {}
    fitAll();
  });
});
try { var sfs = localStorage.getItem('survey-fs'); if (sfs) { var fb = document.querySelector('.fsctl button[data-fs="' + sfs + '"]'); if (fb) fb.click(); } } catch (e) {}


var AC = ['ac-indigo', 'ac-violet', 'ac-emerald', 'ac-coral', 'ac-black'];
function setAccent(v) { var f = document.getElementById('v-form'); AC.forEach(function (c) { f.classList.remove(c); }); if (v) f.classList.add(v); }

function placeSticky() { document.getElementById('hdr').style.top = '0px'; }


/* ===== 제출 ===== */
var API = 'https://script.google.com/macros/s/AKfycbzkrzX_VWgEw8qt2XbaKuwkCJm9Dk3DFEdw9ROHtd1_qngDi-gu0p9d-_R4FN4SnDyN/exec';
var SENT = 'survey2026-sent-' + AUDK;
function collect() {
  var cols = [], ans = {};
  RQ.forEach(function (q, i) {
    var k = (i + 1) + '. [' + q[0] + '] ' + q[2], v;
    if (q[6] === 'L') v = answers[q.ridx] || '';
    else if (q[6] === 'M') v = Array.prototype.map.call(document.querySelectorAll('#card-' + q.ridx + ' .opt'), function (b, j) { return b.classList.contains('on') ? q[7][j] : ''; }).filter(Boolean).join(', ');
    else v = document.querySelector('#card-' + q.ridx + ' textarea').value.trim();
    cols.push(k); ans[k] = v;
  });
  cols.push('응답 언어'); ans['응답 언어'] = LANG === 'ru' ? '러시아어' : '한국어';
  return { aud: AUDK, who: document.getElementById('who').value.trim(), g: document.getElementById('gSel').value, c: document.getElementById('cSel').value, cols: cols, answers: ans };
}
function submit() {
  var miss = RLIKERT.filter(function (q) { return !answers[q.ridx]; });
  if (miss.length) { toast(miss.map(function (q) { return q.rno; }).join(' ') + L(' 문항이 비어 있어요')); return; }
  var btn = document.getElementById('btnNext'), prev = document.getElementById('btnPrev');
  if (btn.disabled) return;
  btn.disabled = true; prev.disabled = true; btn.textContent = L('보내는 중…');
  function fail(m) {
    btn.disabled = false; prev.disabled = false; btn.textContent = L('제출하기');
    toast(m || L('전송에 실패했어요. 인터넷 연결을 확인하고 다시 눌러 주세요'));
  }
  fetch(API, { method: 'POST', body: JSON.stringify(collect()) })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (!j.ok) return fail(j.error);
      try { localStorage.setItem(SENT, String(Date.now())); } catch (e) {}
      btn.disabled = false; prev.disabled = false;
      go(DONE());
    })
    .catch(function () { fail(); });
}
function checkSent() {
  var t = null; try { t = localStorage.getItem(SENT); } catch (e) {}
  if (!t) return;
  var box = document.getElementById('resume');
  if (box.style.display === 'block') return;
  box.innerHTML = LANG === 'ru' ? '✓ С этого устройства анкета уже отправлена. Спасибо!<br><span style="font-size:12.5px;color:var(--sub)">Если ответить ещё раз, ответ сохранится повторно.</span>'
    : AUDK === 'St' ? '✓ 이 기기에서 이미 제출했어요. 고마워요!<br><span style="font-size:12.5px;color:var(--sub)">다시 응답하면 한 번 더 저장돼요.</span>'
    : '✓ 이 기기에서 이미 제출하셨습니다. 감사합니다!<br><span style="font-size:12.5px;color:var(--sub)">다시 응답하시면 한 번 더 저장됩니다.</span>';
  box.style.display = 'block';
}

/* ===== 언어 전환 (한국어 ⇄ 러시아어) ===== */
var STATIC = [['.fsbox .lb', '글씨 크기 조절'], ['label[for="who"]', '성명 (참여 확인용)'], ['#gSel option[value=""]', '학년 선택'],
  ['.kbdhint', '⌨️ PC에서는 숫자키 1~5로도 답할 수 있어요'], ['#donePage h2', '소중한 의견 감사합니다!'], ['#btnPrev', '이전'], ['.brand .s1', '청학중학교']];
function applyStatic() {
  STATIC.forEach(function (s) { var el = document.querySelector(s[0]); if (el) el.textContent = L(s[1]); });
  document.getElementById('who').placeholder = L('이름을 입력해 주세요');
  document.documentElement.lang = LANG;
  document.getElementById('lgChk').checked = LANG === 'ru';
  document.getElementById('lgPillTx').textContent = LANG === 'ru' ? '한국어' : 'Русский';
}
function setLang(l) {
  LANG = l; try { localStorage.setItem('survey2026-lang', l); } catch (e) {}
  var d = snapshot(), pg = page;
  applyStatic(); renderDue(); fillClasses();
  restore(d); go(pg);
  var rs = document.getElementById('resume'); if (rs.style.display === 'block') { rs.style.display = 'none'; checkDraft(); checkSent(); }
}
document.getElementById('lgChk').addEventListener('change', function (e) { setLang(e.target.checked ? 'ru' : 'ko'); });
document.getElementById('lgPill').addEventListener('click', function () { setLang(LANG === 'ru' ? 'ko' : 'ru'); });
if (AUDK === 'T') document.getElementById('lgPill').style.display = 'none';

applyStatic(); renderDue();
setRole(AUDK); placeSticky(); go(-1); checkDraft(); checkSent();
</script>
